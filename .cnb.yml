# 推送到 cnb.cool 时，自动镜像到对应的 GitHub 仓库 h1s97x/gh-snake
#
# 前置条件：在本 cnb 仓库的「设置 → 环境变量 / 机密」中添加一个名为
# GITHUB_TOKEN 的「保密」环境变量，值为具备 h1s97x/gh-snake 仓库
# 写权限的 GitHub Personal Access Token（建议用细粒度 token，仅勾 repo）。
main:
  push:
    - name: mirror to github
      stages:
        - name: push to github
          script: |
            git config user.name "cnb-bot"
            git config user.email "bot@cnb.cool"
            GIT_TERMINAL_PROMPT=0 git push "https://${GITHUB_TOKEN}@github.com/h1s97x/gh-snake.git" HEAD:refs/heads/main
