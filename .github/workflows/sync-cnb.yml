name: Sync to CNB

# 反向兜底：把直接在 GitHub 上的修改回灌到 CNB 源仓库。
# 排除 .cnb*/.github/ 避免与 CNB → GitHub 的同步形成死循环。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6
        with:
          path: github-src
          fetch-depth: 0

      - name: sync to cnb
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://${CNB_TOKEN}@cnb.cool/h1s97x/plugins/gh-snake.git" cnb-dst
          cd cnb-dst
          # 用 rsync 把 GitHub 侧内容（排除 .git/.github/.cnb*）同步进 CNB 工作区
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.cnb*' ../github-src/ ./
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync from github"
          git push
